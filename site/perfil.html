<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nimue | Mi perfil</title>
    <style>
      :root { --bg:#0a0d1f; --text:#f7f8ff; --muted:#b5bbdc; --primary:#7c5cff; }
      *{box-sizing:border-box}
      body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--text);background:radial-gradient(circle at 20% 0%, #1d2350 0%, transparent 35%), radial-gradient(circle at 90% 0%, #2f1f56 0%, transparent 40%), var(--bg)}
      .container{width:min(1120px,92%);margin:0 auto}
      header{position:sticky;top:0;z-index:10;background:rgba(10,13,31,.72);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
      .nav{min-height:72px;display:flex;align-items:center;justify-content:space-between}
      .brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;color:#fff;text-decoration:none}
      .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#ff7ea8)}
      .links{display:flex;gap:12px}
      .btn{border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:9px 12px;color:#fff;text-decoration:none;background:rgba(255,255,255,.05)}
      main{padding:28px 0 42px}
      h1{margin:0 0 6px}
      .muted{color:var(--muted)}
      .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
      .stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:14px}
      .stat strong{font-size:1.6rem;display:block}
      .sections{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
      .card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:14px}
      .list{display:flex;flex-direction:column;gap:9px;margin-top:10px}
      .item{padding:10px;border:1px dashed rgba(255,255,255,.2);border-radius:10px;color:#d5daf6}
      .empty{color:var(--muted)}
      @media (max-width:900px){.stats{grid-template-columns:1fr}.sections{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <header>
      <div class="container nav">
        <a class="brand" href="./index.html"><span class="logo"></span><span>Nimue</span></a>
        <div class="links">
          <a class="btn" href="./dm-publicar.html">Publicar</a>
          <a class="btn" href="./partidas.html">Partidas</a>
        </div>
      </div>
    </header>

    <main class="container">
      <h1>Mi perfil</h1>
      <p id="userLine" class="muted">Inicia una acción (publicar o unirte) para crear tu perfil local.</p>

      <section class="stats">
        <article class="stat"><span class="muted">Partidas jugadas</span><strong id="statPlayed">0</strong></article>
        <article class="stat"><span class="muted">Horas jugadas</span><strong id="statHoursPlayed">0h</strong></article>
        <article class="stat"><span class="muted">Horas de rol próximo mes</span><strong id="statHoursNext">0h</strong></article>
      </section>

      <section class="sections">
        <article class="card">
          <h2 style="margin:0">Partidas creadas como DM</h2>
          <div id="dmList" class="list"></div>
        </article>
        <article class="card">
          <h2 style="margin:0">Partidas a las que te uniste</h2>
          <div id="joinList" class="list"></div>
        </article>
      </section>
    </main>

    <script>
      function parseJson(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
        catch { return fallback; }
      }

      function ts(iso) {
        const t = Date.parse(iso || '');
        return Number.isNaN(t) ? Number.POSITIVE_INFINITY : t;
      }

      function renderItems(target, items, mapper) {
        target.innerHTML = '';
        if (!items.length) {
          target.innerHTML = '<div class="empty">Sin partidas por ahora.</div>';
          return;
        }
        items.forEach((item) => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = mapper(item);
          target.appendChild(div);
        });
      }

      const user = parseJson('nimue_current_user', null);
      const drafts = parseJson('nimue_drafts', []);
      const joined = parseJson('nimue_joined_sessions', []);

      if (user?.email) {
        document.getElementById('userLine').textContent = `Usuario: ${user.username || 'Sin nombre'} · ${user.email}`;
      }

      const dmCreated = drafts
        .filter((x) => (x.dmEmail || '').toLowerCase() === (user?.email || '').toLowerCase())
        .sort((a, b) => ts(a.startAt) - ts(b.startAt));

      const joinedByUser = joined
        .filter((x) => (x.userEmail || '').toLowerCase() === (user?.email || '').toLowerCase())
        .sort((a, b) => ts(a.startAt) - ts(b.startAt));

      const now = Date.now();
      const monthAhead = now + 30 * 24 * 60 * 60 * 1000;

      const played = joinedByUser.filter((x) => ts(x.startAt) < now);
      const hoursPlayed = played.reduce((acc, x) => acc + (Number(x.durationMinutes) || 0), 0) / 60;

      const nextMonthHours = [...dmCreated, ...joinedByUser]
        .filter((x) => {
          const t = ts(x.startAt);
          return t >= now && t <= monthAhead;
        })
        .reduce((acc, x) => acc + (Number(x.durationMinutes) || 0), 0) / 60;

      document.getElementById('statPlayed').textContent = String(played.length);
      document.getElementById('statHoursPlayed').textContent = `${hoursPlayed.toFixed(1)}h`;
      document.getElementById('statHoursNext').textContent = `${nextMonthHours.toFixed(1)}h`;

      renderItems(
        document.getElementById('dmList'),
        dmCreated,
        (x) => `<strong>${x.title || 'Partida'}</strong><br/>Inicio: ${new Date(x.startAt).toLocaleString()} · ${x.durationMinutes || '-'} min · ${x.pricePerPlayer || '-'}€`
      );

      renderItems(
        document.getElementById('joinList'),
        joinedByUser,
        (x) => `<strong>${x.campaignTitle || 'Partida'}</strong><br/>Inicio: ${new Date(x.startAt).toLocaleString()} · ${x.durationMinutes || '-'} min · ${x.pricePerPlayer || '-'}€`
      );
    </script>
  </body>
</html>
